# Integrations-Cockpit rules configuration (draft v1.6, 21.11.2026)
# Edit this file to change a rule; no code change needed.
# Every value here is shown in the app's "Rules" panel. Values marked ASSUMPTION
# are defaults until ASD answers the open questions (02_data/MISSING_AND_OPEN_QUESTIONS.md).
# Values marked ORGANISERS follow the hackathon organisers' answers of 21.11.2026 (not yet confirmed by ASD directly).

version: "1.6"

stichtag: auto                 # auto = export date; or "20.11.2026"
at_risk_window_months: 6

population:
  require_open_responsibility: true      # Zuständigkeitsende >= Stichtag
  exclude_handed_over: true              # Datum Übergang Gemeindezuständigkeit <= Stichtag -> not current (ASSUMPTION Q14)

scope:
  statuses: ["VA", "F-FL", "B-FL", "B-RSFL", "B-SL"]          # ORGANISERS Q1: these five permits count
  excluded_statuses: ["S", "N (Asylsuchende)", "VA+7", "F-FL+7", "B-FL+5", "B-RSFL+7", "B-SL+5"]   # "+5"/"+7" = federal payment period over (ORGANISERS Q9)
  min_age: 16
  age_reference: stichtag                # ORGANISERS Q2: age 16 on the Stichtag (options: stichtag | entry | deadline)

goal1:
  years_from_entry: 3
  entry_event: "Aufenthalt (Einreise)"
  birth_event: "Aufenthalt (Geburt)"     # -> not applicable (ASSUMPTION Q11)
  languages_counting: ["Deutsch"]        # ASSUMPTION Q10
  min_level: "A1"
  level_order: ["A0", "A1", "A2", "B1", "B2", "C1", "C2"]
  accepted_proof: ["Zertifizierung", "Muttersprache", "Beendigung obligatorische Schulzeit", "Beendigung Ausbildung"]   # ORGANISERS Q3: certificate (telc/fide), mother tongue, Swiss schooling, completed education count; "Weiteres" (e.g. course attendance) does not. Values = Sprachstand template "Art"
  mother_tongue_counts: true
  count_late_as_reached: false           # late = green with marker, not in payment (ASSUMPTION Q12)
  active_course_softens_risk: true
  language_course_keywords: ["Förderangebot Sprache", "Sprachkurs", "Deutsch", "Alphabetisierung", "A1", "fide", "telc"]   # matched in Art or Bezeichnung (template Art: "Förderangebot Sprache", "Sprachkurs im erweiterten Verfahren (N)")

payment_period:                          # goals 2 and 3 must be reached within the federal payment period (= end of responsibility)
  years_by_status: { "VA": 7, "F-FL": 7, "B-FL": 5, "B-RSFL": 5, "B-SL": 5 }   # ASSUMPTION for B-RSFL: 5 years as in the brief, although ASD's status list has "B-RSFL+7". Otherwise brief + organisers: 7 years for VA / F-FL, 5 years for B-FL / B-SL
  counted_from: { "VA": "entry", "F-FL": "entry", "B-FL": "application", "B-RSFL": "application", "B-SL": "application" }   # Brief: VA / F-FL from entry, B-* from the asylum application
  application_events: ["Asylgesuch"]     # Asylgeschäftsart starting with this = asylum application; if none, the entry date is used and the trace says so
  # Deadline for goals 2 and 3 = the earlier of (start + years) and Zuständigkeitsende. If they differ by more than dq.date_tolerance_days, Data quality shows it.

goal2:
  min_pensum: 60                         # Brief: a job with a work contract, at least 60 %, for 6 months without a break
  months_uninterrupted: 6
  combine_jobs: true                     # ASSUMPTION two contract jobs are added up; awaiting ASD confirmation
  max_gap_days: 0
  exclude_keywords: ["Programm", "Einsatzplatz", "Praktikum", "Beschäftigungsprogramm", "Arbeitsintegration", "freiwillig", "Freiwilligenarbeit", "ehrenamtlich", "unbezahlt"]   # ORGANISERS Q4: only jobs with a work contract count; volunteering, unpaid internships and programme/placement work are excluded (matched in Bemerkungen or Arbeitgeber Name)
  education_types: ["Sek II", "Tertiär"]
  education_counts_from: completion      # ORGANISERS Q5: Sek II / Tertiär counts on completion (options: start | completion)
  count_self_employed: true              # selbstständig counts as work (ASSUMPTION Q4)

goal3:
  months_without_support: 12
  support_types: ["Sozialhilfe", "Nothilfe"]   # ASSUMPTION Q6
  deadline_from: head                    # head | latest_member | earliest_member (ASSUMPTION Q6)

goal_mapping:                            # Integrationszielerreichung "Art" -> goal. "Grundpauschale Integration" is not one of the three goals and is ignored
  goal1_keywords: ["Sprachniveau A1", "Sprach", "A1"]   # TEMPLATE: Art "Sprachniveau A1" (other words: fallback for older exports)
  goal2_keywords: ["Aufnahme Ausbildung / Erwerbstätigkeit", "Erwerb", "Ausbildung", "Arbeit"]   # TEMPLATE: Art "Aufnahme Ausbildung / Erwerbstätigkeit"
  goal3_keywords: ["Finanzielle Unabhängigkeit", "Sozialhilfe", "wirtschaftlich", "Ablösung"]   # TEMPLATE: Art "Finanzielle Unabhängigkeit"
  ignore_status_s_rows: true             # rows with "Ziel mit Status S erreicht" = yes are ignored (ASSUMPTION Q13)

whatif_2027:
  switch_date: "01.01.2027"
  new_years_from_entry: 5                # from the switch date the payment period is 5 years for every permit
  interpretation: B                      # ORGANISERS Q7: B = the rule applies to people arriving from 01.01.2027 (already in the deadlines); A = what-if: also for current 7-year clients

payment:
  lump_sum_chf:                          # paid per reached goal under ASD's service contract with the canton (GSI): a base lump sum per person plus a different lump sum per goal. The amounts are not public (each regional partner offered its own price): enter them from the contract, here or in Overview → Forecast
    goal1: null                          # Sprachniveau A1. null = not set: counts only
    goal2: null                          # Aufnahme Ausbildung / Erwerbstätigkeit. null = not set: counts only
    goal3: null                          # Finanzielle Unabhängigkeit. null = not set: counts only
  forecast_quarters: 4

calls:
  top_n: 6
  inactive_months: 6
  transition_months: 9
  rank_by_payout: false                  # never true

patterns:
  min_group_size: 10
  confidence: 0.95
  method: wilson

dq:
  date_tolerance_days: 31
  employer_match_threshold: 0.8
  legal_forms_to_strip: ["AG", "GmbH", "SA", "Sàrl", "Sagl", "KLG", "& Co."]

ai:
  provider: ollama                       # local only; never a cloud API with real data
  endpoint: "http://localhost:11434"
  model: "qwen2.5:7b-instruct"           # alternatives: llama3.1:8b, mistral-nemo
  temperature: 0
  use_cached_results_when_offline: true  # demo safety; UI must label cached results
  embed_model: "nomic-embed-text"        # local search for "Frag das Cockpit" (rules, brief, docs; no client data)

voice:                                   # reading answers aloud in "Frag das Cockpit"
  default: local                         # local = the computer's own voice, offline | elevenlabs = cloud voice, only for answers without client data
  elevenlabs_model: "eleven_multilingual_v2"   # speaks German and English
  elevenlabs_voice_id: "Xb7hH8MSUJpSbSDYk0k2"  # "Alice" (ElevenLabs premade voice). The API key stays in .env.local on this computer

i18n:
  default_language: de                   # de | en
